name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Empty job environment: the build must be green with NO secrets / API keys
    # (default planner is smart_mock). Do not add any secret to this workflow.
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (editable + dev)
        run: pip install -e ".[dev]"

      - name: Secret scan (fail fast)
        run: python -X utf8 scripts/verify_no_secrets.py

      - name: Unit tests
        run: python -X utf8 -m pytest -q

      - name: Offline governance evals (pass rate 1.0)
        run: python -X utf8 scripts/run_evals.py
