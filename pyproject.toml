[project]
name = "teow_agl"
version = "10.8.0"
description = "GovGuard MY MAIC Submission — Governed School-Administration Agent Runtime (Powered by TEOW-AGL)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["teow_agl*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
